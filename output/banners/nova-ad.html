<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NOVA Ad Creative</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Grotesk:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #020409;
    font-family: 'Space Grotesk', 'Inter', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: radial-gradient(ellipse 80% 60% at 50% 20%, #0f0524 0%, #06091a 40%, #020409 100%);
    overflow: hidden;
  }

  /* ── Ambient orbs ── */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    mix-blend-mode: screen;
    opacity: 0.55;
  }
  .orb-1 {
    width: 600px; height: 600px;
    top: -180px; left: -120px;
    background: radial-gradient(circle, #7c3aed 0%, #4f46e5 50%, transparent 70%);
  }
  .orb-2 {
    width: 500px; height: 500px;
    bottom: -100px; right: -80px;
    background: radial-gradient(circle, #06b6d4 0%, #0ea5e9 40%, transparent 70%);
    opacity: 0.45;
  }
  .orb-3 {
    width: 350px; height: 350px;
    top: 45%; left: 55%;
    background: radial-gradient(circle, #e879f9 0%, #a855f7 50%, transparent 70%);
    opacity: 0.3;
  }

  /* ── Noise grain overlay ── */
  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
  }

  /* ── Grid lines ── */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(139,92,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.06) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 100%);
  }

  /* ── Liquid glass card ── */
  .glass-card {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 820px;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.07) 0%,
      rgba(139,92,246,0.05) 50%,
      rgba(6,182,212,0.04) 100%);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: 32px;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 80px 80px 72px;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.15),
      0 32px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -1px 0 rgba(139,92,246,0.1);
  }

  /* ── Iridescent top accent line ── */
  .accent-line {
    position: absolute;
    top: 0; left: 80px; right: 80px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      #7c3aed 20%,
      #e879f9 50%,
      #06b6d4 80%,
      transparent 100%);
    border-radius: 2px;
  }

  /* ── Eyebrow tag ── */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(139,92,246,0.15);
    border: 1px solid rgba(139,92,246,0.35);
    border-radius: 100px;
    padding: 6px 18px 6px 12px;
    margin-bottom: 40px;
  }
  .eyebrow-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #a78bfa;
    box-shadow: 0 0 8px #a78bfa;
  }
  .eyebrow-text {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #c4b5fd;
  }

  /* ── Main headline ── */
  .headline {
    font-size: 88px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.04em;
    margin-bottom: 28px;
    background: linear-gradient(135deg,
      #ffffff 0%,
      #e2d9f3 30%,
      #c4b5fd 60%,
      #67e8f9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Subheadline ── */
  .subheadline {
    font-size: 20px;
    font-weight: 300;
    line-height: 1.6;
    color: rgba(196,181,253,0.7);
    max-width: 540px;
    margin-bottom: 56px;
    letter-spacing: 0.01em;
  }

  /* ── CTA row ── */
  .cta-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .cta-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 40px;
    border-radius: 100px;
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-decoration: none;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.5),
      0 8px 32px rgba(124,58,237,0.45),
      0 2px 8px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .cta-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: skewX(-20deg);
  }
  .cta-arrow {
    font-size: 18px;
  }

  .cta-secondary {
    font-size: 15px;
    font-weight: 500;
    color: rgba(196,181,253,0.6);
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Bottom stat row ── */
  .stats-row {
    position: absolute;
    bottom: 64px;
    left: 80px;
    display: flex;
    gap: 0;
  }
  .stat {
    padding: 0 36px;
    border-right: 1px solid rgba(139,92,246,0.2);
  }
  .stat:first-child { padding-left: 0; }
  .stat:last-child { border-right: none; }
  .stat-number {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  .stat-label {
    font-size: 12px;
    font-weight: 400;
    color: rgba(148,163,184,0.6);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Logo mark ── */
  .logo-mark {
    position: absolute;
    top: 56px;
    left: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(124,58,237,0.5);
  }
  .logo-icon svg {
    width: 20px; height: 20px;
  }
  .logo-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #fff;
    text-transform: uppercase;
  }

  /* ── Floating orb visual top-right ── */
  .hero-sphere {
    position: absolute;
    top: 40px;
    right: 80px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%,
      rgba(255,255,255,0.18) 0%,
      rgba(167,139,250,0.3) 25%,
      rgba(79,70,229,0.5) 55%,
      rgba(6,182,212,0.3) 80%,
      rgba(0,0,0,0.1) 100%);
    box-shadow:
      0 0 60px rgba(124,58,237,0.4),
      0 0 120px rgba(6,182,212,0.2),
      inset 0 0 40px rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .hero-sphere::after {
    content: '';
    position: absolute;
    top: 18%; left: 20%;
    width: 35%; height: 20%;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    filter: blur(6px);
    transform: rotate(-30deg);
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Ambient lighting -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Texture -->
  <div class="grain"></div>
  <div class="grid"></div>

  <!-- Logo -->
  <div class="logo-mark">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2L12.5 7.5L18 8.5L14 12.5L15 18L10 15.5L5 18L6 12.5L2 8.5L7.5 7.5L10 2Z" fill="white" opacity="0.9"/>
      </svg>
    </div>
    <span class="logo-name">Nova</span>
  </div>

  <!-- Glass card -->
  <div class="glass-card">
    <div class="accent-line"></div>

    <!-- Hero sphere inside card top-right -->
    <div class="hero-sphere"></div>

    <div class="eyebrow">
      <span class="eyebrow-dot"></span>
      <span class="eyebrow-text">Introducing v2.0</span>
    </div>

    <div class="headline">Beyond<br>the<br>Horizon.</div>

    <div class="subheadline">
      A new era of intelligent design — built for those who move faster than light.
    </div>

    <div class="cta-row">
      <a class="cta-primary" href="#">
        Get Early Access
        <span class="cta-arrow">→</span>
      </a>
      <span class="cta-secondary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="rgba(196,181,253,0.5)" stroke-width="1.2"/><path d="M7 4v3.5l2 2" stroke="rgba(196,181,253,0.5)" stroke-width="1.2" stroke-linecap="round"/></svg>
        Limited launch — 48h only
      </span>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat">
        <div class="stat-number">10×</div>
        <div class="stat-label">Faster</div>
      </div>
      <div class="stat">
        <div class="stat-number">99.9%</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat">
        <div class="stat-number">50K+</div>
        <div class="stat-label">Users</div>
      </div>
    </div>

  </div>

</div>
</body>
</html>

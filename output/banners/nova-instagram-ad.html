<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NOVA Instagram Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  /* Fonts loaded via link tag below */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #080808;
    font-family: 'Inter', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: #080808;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Subtle texture grain ── */
  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
  }

  /* ── Very subtle gradient wash ── */
  .bg-wash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,255,255,0.02) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Top section: brand + tagline ── */
  .top-section {
    padding: 68px 80px 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
    z-index: 5;
  }

  .brand-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 52px;
  }

  /* ── Hero text block ── */
  .hero-block {
    position: relative;
    z-index: 5;
    padding: 0 80px;
    margin-top: auto;
  }

  .hero-eyebrow {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
    margin-bottom: 24px;
  }

  .hero-line-1 {
    font-size: 118px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: #ffffff;
    text-transform: uppercase;
    display: block;
  }

  .hero-line-2 {
    font-size: 118px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: #ffffff;
    text-transform: uppercase;
    display: block;
  }

  .hero-line-italic {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 108px;
    font-weight: 700;
    font-style: italic;
    line-height: 1.0;
    letter-spacing: -0.01em;
    color: #ffffff;
    display: block;
    margin-top: 4px;
  }

  /* ── Product strip ── */
  .product-strip {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* A dark editorial right-side panel */
  .product-panel {
    position: absolute;
    right: 0; top: 0;
    width: 360px; height: 100%;
    background: linear-gradient(105deg, #0e0e0e 0%, #151515 50%, #1a1a1a 100%);
    border-left: 1px solid rgba(255,255,255,0.08);
  }

  /* ── Vertical rule ── */
  .v-rule {
    position: absolute;
    left: 710px; top: 120px; bottom: 120px;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.12) 70%, transparent);
    z-index: 6;
  }

  /* ── Right side content ── */
  .right-panel {
    position: absolute;
    right: 0; top: 0;
    width: 370px; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 60px 80px 50px;
    z-index: 6;
  }

  .right-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    margin-bottom: 32px;
  }

  /* Product image mockup cards */
  .product-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    margin-bottom: 40px;
  }

  .product-card {
    background: #1c1c1c;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .product-swatch {
    width: 52px; height: 52px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: white;
    text-transform: uppercase;
  }
  .swatch-black { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12); }
  .swatch-navy  { background: #1e2a4a; border: 1px solid rgba(255,255,255,0.08); }

  .product-info { flex: 1; }
  .product-name {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .product-sub {
    font-size: 11px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .product-price {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .right-cta-text {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    line-height: 1.8;
  }
  .right-url {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.85);
    text-transform: lowercase;
    margin-top: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 2px;
    display: inline-block;
  }

  /* ── Middle: main left content ── */
  .left-content {
    position: absolute;
    left: 0; top: 0;
    width: 710px; height: 100%;
    display: flex;
    flex-direction: column;
    padding: 68px 80px 64px;
    z-index: 5;
  }

  /* ── Bottom metadata row ── */
  .bottom-row {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .coord-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .coord-label {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
  .coord-value {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
  }

  .url-block {
    text-align: right;
  }
  .url-label {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    margin-bottom: 4px;
  }
  .url-value {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.75);
    text-transform: lowercase;
  }

  /* ── Thin horizontal rule ── */
  .h-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0.08), rgba(255,255,255,0.08) 60%, transparent);
    margin-bottom: 28px;
  }

  /* ── Collection badge ── */
  .collection-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 48px;
  }
  .badge-dash {
    width: 24px; height: 1px;
    background: rgba(255,255,255,0.3);
  }
  .badge-text {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

</style>
</head>
<body>
<div class="canvas">

  <div class="bg-wash"></div>
  <div class="grain"></div>

  <!-- Left content panel -->
  <div class="left-content">

    <!-- Top brand name -->
    <div class="brand-name">N O V A</div>

    <!-- Collection tag -->
    <div class="collection-badge">
      <div class="badge-dash"></div>
      <div class="badge-text">2025 Collection</div>
    </div>

    <!-- Main hero headline -->
    <div style="margin-bottom: 0;">
      <div class="hero-eyebrow">Wear your mindset</div>
      <span class="hero-line-1">TAKE</span>
      <span class="hero-line-2">THE</span>
      <span class="hero-line-italic">Risk.</span>
    </div>

    <!-- Bottom row -->
    <div style="margin-top: auto;">
      <div class="h-rule"></div>
      <div class="bottom-row">
        <div class="coord-block">
          <div class="coord-label">Origin</div>
          <div class="coord-value">37.7335° N, 119.6376° W</div>
        </div>
        <div class="url-block">
          <div class="url-label">Shop now</div>
          <div class="url-value">novaly.us</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Vertical divider -->
  <div class="v-rule"></div>

  <!-- Right panel -->
  <div class="right-panel">

    <div class="right-label">Featured Drops</div>

    <div class="product-cards">

      <div class="product-card">
        <div class="product-swatch swatch-black">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M6 4h12l2 4H4L6 4z" fill="rgba(255,255,255,0.4)"/>
            <path d="M4 8v12a2 2 0 002 2h12a2 2 0 002-2V8H4z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
          </svg>
        </div>
        <div class="product-info">
          <div class="product-name">Take The Risk</div>
          <div class="product-sub">Hoodie · Black</div>
        </div>
        <div class="product-price">$79</div>
      </div>

      <div class="product-card">
        <div class="product-swatch swatch-navy">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 4h14l1 3H4L5 4z" fill="rgba(255,255,255,0.4)"/>
            <path d="M4 7v13a2 2 0 002 2h12a2 2 0 002-2V7H4z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
          </svg>
        </div>
        <div class="product-info">
          <div class="product-name">Create Your Legacy</div>
          <div class="product-sub">Crewneck · Navy</div>
        </div>
        <div class="product-price">$69</div>
      </div>

      <div class="product-card">
        <div class="product-swatch swatch-black">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M8 4h8l3 3H5L8 4z" fill="rgba(255,255,255,0.4)"/>
            <path d="M5 7v13a2 2 0 002 2h10a2 2 0 002-2V7H5z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
          </svg>
        </div>
        <div class="product-info">
          <div class="product-name">Leap of Faith</div>
          <div class="product-sub">Tee · Black</div>
        </div>
        <div class="product-price">$49</div>
      </div>

    </div>

    <div class="right-cta-text">
      Limited drops.<br>Bold moves.
    </div>
    <div class="right-url">novaly.us</div>

  </div>

</div>
</body>
</html>
